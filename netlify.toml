# Configurazione Netlify per "I Miei Libri"
# Il sito è statico: non serve alcun build, si pubblica la cartella così com'è.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Il service worker deve essere sempre ricontrollato, altrimenti gli
# aggiornamenti dell'app non arrivano agli utenti già installati.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Le pagine e il manifest cambiano a ogni rilascio: meglio rivalidarli.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Asset che non cambiano mai: cache lunga (i nomi dei font sono univoci).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/splash/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
